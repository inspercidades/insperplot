# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# Build and deploy are two jobs on purpose. A job-level `environment:` binds
# before any step runs and is not affected by step-level `if:`, so a combined
# job fails on pull requests with "Branch refs/pull/N/merge is not allowed to
# deploy to github-pages due to environment protection rules" — before it has
# built anything. Splitting them lets PRs validate the build while only pushes
# to the default branch touch the github-pages environment.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      # pkgdown renders every root-level .md into the published site and ignores
      # .Rbuildignore entirely (see pkgdown:::package_mds), so our internal agent
      # instructions would end up on the public site, in sitemap.xml and in the
      # search index. Delete them in the runner before the build — they are not
      # part of the package, and the checkout is discarded afterwards.
      - name: Drop internal agent docs before building
        run: rm -f CLAUDE.md AGENTS.md

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
