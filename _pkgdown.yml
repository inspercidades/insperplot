url: https://portalcidados.github.io/insperplot/

template:
  bootstrap: 5
  light-switch: true
  bslib:
    primary: "#E50505"
    secondary: "#3ACC9F"
    base_font: {google: "Inter"}
    heading_font: 'Georgia, "Playfair Display", "EB Garamond", serif'
    code_font: {google: "JetBrains Mono"}
    link-color: "#E50505"
    link-hover-color: "#A50404"
    navbar-bg: "#E50505"
    pkgdown-nav-height: 72px

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github, lightswitch]
  components:
    reference:
      text: Reference
      href: reference/index.html
    articles:
      text: Articles
      menu:
      - text: Getting Started
        href: articles/getting-started.html
      - text: How to follow Insper's design guide
        href: articles/brand-kit.html
      - text: Color Reference Table
        href: articles/color-reference.html
    news:
      text: News
      href: news/index.html
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/portalcidados/insperplot
      aria-label: GitHub

home:
  sidebar:
    structure: [links, license, community, citation, authors, dev]

reference:
- title: Themes
  desc: Apply Insper's visual identity to ggplot2 plots
  contents:
  - theme_insper
  - theme_insper_doc

- title: Colors and Palettes
  desc: Access Insper brand colors and palettes
  contents:
  - insper_palette
  - show_insper_palettes

- title: ggplot2 Scales
  desc: Insper color scales for ggplot2
  contents:
  - starts_with("scale_")

- title: Plot Functions
  desc: Pre-configured plotting functions with Insper theme
  contents:
  - insper_barplot
  - insper_scatterplot
  - insper_timeseries
  - insper_area
  - insper_boxplot
  - insper_violin
  - insper_heatmap
  - insper_histogram
  - insper_density

- title: Utilities
  desc: Helper functions for formatting, fonts, and saving plots
  contents:
  - save_insper_plot
  - format_num_br
  - has_insper_fonts

- title: Data
  desc: Package datasets
  contents:
  - has_keyword("datasets")

figures:
  dev: ragg::agg_png
  dpi: 96
  dev.args: []
  fig.ext: png
  fig.width: 9
  fig.height: 5.5
  fig.retina: 2
  bg: white

footer:
  structure:
    left: developed_by
    right: built_with

authors:
  Vinicius Oike:
    href: https://github.com/viniciusoike
